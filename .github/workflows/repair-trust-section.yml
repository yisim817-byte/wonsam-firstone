name: One-time trust section repair

on:
  push:
    paths:
      - '.github/workflows/repair-trust-section.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert trust section on homepage only
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8-sig')

          section = '''
    <section class="humane-trust-section" data-humane-trust-section aria-labelledby="humane-trust-title">
      <div class="humane-trust-inner">
        <h2 id="humane-trust-title">신뢰를 기준으로 안내합니다</h2>
        <span class="humane-trust-accent" aria-hidden="true"></span>
        <div class="humane-trust-list">
          <p>확인된 자료를 기준으로 안내하며, 과장된 표현보다 정확한 정보를 우선합니다.</p>
          <p>모든 분양 정보는 공식 자료와 현장 확인 내용을 바탕으로 제공하며, 계약 전 세부 조건을 다시 안내드립니다.</p>
          <p>고객의 판단에 필요한 정보를 투명하게 제공하고, 장점뿐 아니라 확인이 필요한 사항도 함께 안내합니다.</p>
          <p>단기적인 계약보다 정확한 설명과 책임 있는 상담을 우선하는 분양 안내를 지향합니다.</p>
          <p>계약 상담부터 계약 진행, 자금 일정, 공사 진행 확인 및 입주 준비까지 고객이 알아야 할 전 과정을 단계별로 안내합니다.</p>
          <p>분양조건·사업계획·입지 정보는 변경될 수 있으므로, 최종 계약 전 공식 서류와 현장 안내를 반드시 확인해 주시기 바랍니다.</p>
        </div>
      </div>
    </section>

'''

          if 'data-humane-trust-section' not in text:
              marker = '    <footer class="site-footer">'
              if marker not in text:
                  raise SystemExit('homepage footer marker not found')
              text = text.replace(marker, section + marker, 1)

          css_link = '    <link rel="stylesheet" href="trust-section.css">\n'
          if 'trust-section.css' not in text:
              marker = '    <link rel="stylesheet" href="style.css">\n'
              if marker not in text:
                  raise SystemExit('stylesheet marker not found')
              text = text.replace(marker, marker + css_link, 1)

          index.write_text(text, encoding='utf-8')

          Path('trust-section.css').write_text('''
.humane-trust-section {
  background: #f6f4f1;
  padding: 72px 20px 80px;
}
.humane-trust-inner {
  width: min(1120px, 100%);
  margin: 0 auto;
}
.humane-trust-section h2 {
  margin: 0;
  color: #263548;
  text-align: center;
  font-size: clamp(1.75rem, 3vw, 2.35rem);
  font-weight: 800;
  line-height: 1.3;
  letter-spacing: -0.035em;
}
.humane-trust-accent {
  display: block;
  width: 44px;
  height: 3px;
  margin: 18px auto 30px;
  background: #d47a3a;
}
.humane-trust-list {
  display: grid;
  gap: 12px;
}
.humane-trust-list p {
  margin: 0;
  padding: 20px 28px;
  border-left: 4px solid #d47a3a;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.96);
  box-shadow: 0 5px 18px rgba(28, 39, 51, 0.06);
  color: #56616e;
  text-align: center;
  font-size: 0.98rem;
  line-height: 1.75;
  word-break: keep-all;
}
@media (max-width: 640px) {
  .humane-trust-section { padding: 52px 16px 58px; }
  .humane-trust-accent { margin-bottom: 24px; }
  .humane-trust-list p {
    padding: 18px 18px;
    font-size: 0.93rem;
    line-height: 1.7;
  }
}
'''.lstrip(), encoding='utf-8')

          Path('.github/workflows/repair-trust-section.yml').unlink()
      - name: Commit repaired homepage
        run: |
          git config user.name "OpenAI repair bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore footer and add trust guidance only" || exit 0
          git push origin HEAD:main

# trigger
